name: CI

on:
  pull_request:
    # main receives already validated stable releases via promotion PRs.
    branches-ignore: [main]
    paths-ignore:
      - "**/*.md"
      - "README*"
      - "docs/**"
      - ".vscode/**"
      - "AGENTS.md"
      - "LICENSE"
      - ".github/dependabot.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ensure Cargo uses the installed CI toolchain instead of the local development pin.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            release:
              - 'scripts/open-release-promotion.py'
              - 'scripts/tests/test_release_promotion.py'
              - 'scripts/prepare-release-downloads.sh'
              - 'scripts/collect-linux-installer.sh'
              - 'scripts/tests/test_release_downloads.py'
              - 'scripts/tests/test_release_workflow.py'
              - 'scripts/tests/test_linux_installer.py'
              - 'scripts/tests/test_rebrand_identity.py'
              - 'scripts/remove-signing-wait.py'
              - 'scripts/tests/test_signing_wait.py'
              - 'packaging/linux/**'
              - 'pages/index.html'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-candidate.yml'
              - '.github/workflows/microsoft-store-package.yml'
              - 'scripts/build-msix*.ps1'
              - 'scripts/publish-msstore.ps1'
              - 'scripts/resolve-store-upload.py'
              - 'scripts/tests/test_store_upload.py'
              - 'scripts/tests/test-msix-upload.ps1'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
              - 'crates/**'
              - 'src-tauri/**'
              - 'scripts/*windows*.ps1'
              - 'scripts/build-msix*.ps1'
              - 'scripts/publish-msstore.ps1'
              - 'scripts/resolve-store-upload.py'
              - 'scripts/tests/test_store_upload.py'
              - 'scripts/tests/test-msix-upload.ps1'
              - 'scripts/tests/test-windows-architecture.ps1'
              - 'scripts/tests/test-windows-uninstall.ps1'
              - 'scripts/tests/test-windows-install-directory.ps1'
              - 'packaging/windows-msix/**'
            ui:
              - 'ui/**'
              - 'ui/pnpm-lock.yaml'

  release-promotion-tests:
    name: Release automation tests
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -p test_release_promotion.py
      - run: python3 -m unittest discover -s scripts/tests -p test_release_downloads.py
      - run: python3 -m unittest discover -s scripts/tests -p test_release_workflow.py
      - run: python3 -m unittest discover -s scripts/tests -p test_store_upload.py
      - run: python3 -m unittest discover -s scripts/tests -p test_linux_installer.py
      - run: python3 -m unittest discover -s scripts/tests -p test_rebrand_identity.py
      - run: python3 -m unittest discover -s scripts/tests -p test_signing_wait.py

  rust:
    name: Rust (${{ matrix.os }})
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}-${{ runner.arch }}
      - run: cargo check --workspace
      - run: cargo test --workspace
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/test-windows-architecture.ps1
      - run: cargo check -p speaker-volume-bridge --features ui-demo
      - run: cargo check -p speaker-volume-bridge --features ui-windows
      - run: cargo check -p speaker-volume-bridge --features ui-macos
      - run: cargo check -p speaker-volume-bridge --features ui-ubuntu
      - uses: pnpm/action-setup@v6
        if: runner.os == 'Windows'
        with:
          version: 12
      - uses: actions/setup-node@v7
        if: runner.os == 'Windows'
        with:
          node-version: "lts/*"
      - if: runner.os == 'Windows'
        run: pnpm --dir ui install --frozen-lockfile
      - name: Windows installer regression
        if: runner.os == 'Windows'
        run: pnpm dlx @tauri-apps/cli@2 build --debug --bundles nsis
      - name: Package native Store MSIX for combined upload verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-msix.ps1 -ExecutablePath target/debug/speaker-volume-bridge.exe -Architecture '${{ runner.arch }}'
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ci-msix-${{ runner.arch }}
          path: target/release/bundle/msix/*.msix
          if-no-files-found: error
      - name: Windows uninstall registration regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/test-windows-uninstall.ps1
      - name: Windows install directory migration regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/test-windows-install-directory.ps1

  windows-store-upload:
    name: Combined Microsoft Store upload regression
    needs: [changes, rust]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-msix-*
          merge-multiple: true
          path: microsoft-store-msix
      - uses: microsoft/microsoft-store-apppublisher@v1
        with:
          version: v0.4.3
      - shell: pwsh
        run: ./scripts/tests/test-msix-upload.ps1 -PackageDirectory microsoft-store-msix

  rust-quality:
    name: Rust quality (${{ matrix.os }})
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Cache Linux desktop package archives
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ matrix.os }}-${{ runner.arch }}-apt-linux-desktop-v1
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev dbus-daemon
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}-${{ runner.arch }}-${{ runner.arch }}
      - run: pnpm run ci:rustfmt
      - run: pnpm run ci:clippy
      - run: pnpm run ci:test
      - run: cargo clippy -p speaker-volume-bridge --all-targets --features ui-demo -- -D warnings
      - run: cargo test -p speaker-volume-bridge --features ui-demo

  frontend:
    name: Frontend
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm run ci:frontend

  macos-packaging:
    name: macOS packaging configuration
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify-macos-packaging-config.sh
      - run: python3 scripts/check-legacy-identifiers.py
