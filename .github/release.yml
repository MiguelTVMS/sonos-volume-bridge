changelog:
  categories:
    - title: "✨ Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Fixes"
      labels:
        - bug
        - fix
    - title: "🧰 Maintenance"
      labels:
        - maintenance
        - refactor
    - title: "📚 Documentation"
      labels:
        - documentation
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
