name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "README*"
      - "docs/**"
      - ".vscode/**"
      - "AGENTS.md"
      - "LICENSE"
      - ".github/dependabot.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.md"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'crates/**'
              - 'src-tauri/**'
            ui:
              - 'ui/**'
              - 'ui/pnpm-lock.yaml'

  rust:
    name: Rust (${{ matrix.os }})
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}
      - run: cargo check --workspace

  rust-quality:
    name: Rust quality
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - name: Cache Linux desktop package archives
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-linux-desktop-v1
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}
      - run: pnpm run ci:rustfmt
      - run: pnpm run ci:clippy
      - run: pnpm run ci:test

  frontend:
    name: Frontend
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm run ci:frontend

  macos-packaging:
    name: macOS packaging configuration
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify-macos-packaging-config.sh
