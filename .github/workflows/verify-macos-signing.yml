name: Verify macOS Signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-macos-signing
  cancel-in-progress: false

jobs:
  verify:
    name: Sign, notarize, and verify macOS app
    runs-on: macos-latest
    environment: apple-signing
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: workspace
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: cargo install tauri-cli --version '^2' --locked
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F "\"$APPLE_SIGNING_IDENTITY\""
      - name: Prepare the notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and staple the app
        run: cargo tauri build --bundles app
      - name: Verify the signed and notarized app
        run: |
          app_path='target/release/bundle/macos/Sonos Volume Bridge.app'
          ./scripts/verify-macos-artifact.sh direct "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - name: Archive the verified app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            'target/release/bundle/macos/Sonos Volume Bridge.app' \
            "sonos-volume-bridge-${GITHUB_SHA}-macos-verification.zip"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-signing-verification
          path: sonos-volume-bridge-*-macos-verification.zip
          if-no-files-found: error
      - name: Remove temporary Apple credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/apple-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
