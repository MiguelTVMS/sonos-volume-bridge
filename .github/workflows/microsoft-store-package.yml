name: Microsoft Store Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry (leave empty to build new packages)
        required: false
        type: string
      mode:
        description: Validate without upload, or submit the existing GA release
        required: true
        type: choice
        default: validate
        options: [validate, submit]

permissions:
  contents: read
  actions: read

concurrency:
  group: microsoft-store-package-${{ github.ref }}
  cancel-in-progress: false

# Ensure Cargo uses the installed CI toolchain instead of the local development pin.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  msix:
    name: Build Microsoft Store MSIX
    if: inputs.release_tag == '' && inputs.mode == 'validate'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-Windows-${{ matrix.arch }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: cargo install tauri-cli --version '^2' --locked
      - run: cargo tauri build --no-bundle
      - name: Build and validate the MSIX package
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: microsoft-store-msix-${{ matrix.arch }}
          path: target/release/bundle/msix/*.msix
          if-no-files-found: error

  upload:
    name: Build combined Store upload
    needs: msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: microsoft-store-msix-*
          merge-multiple: true
          path: microsoft-store-msix
      - shell: pwsh
        run: ./scripts/build-msix-upload.ps1 -PackageDirectory microsoft-store-msix -OutputPath store-upload/SonosVolumeBridge.msixupload
      - uses: actions/upload-artifact@v7
        with:
          name: microsoft-store-upload
          path: store-upload/*.msixupload
          if-no-files-found: error

  resolve-release:
    name: Resolve existing release upload
    if: inputs.release_tag != '' || inputs.mode == 'submit'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      artifact: ${{ steps.resolve.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MODE: ${{ inputs.mode }}
        run: python3 scripts/resolve-store-upload.py --tag "$RELEASE_TAG" --mode "$MODE"

  validate-release:
    name: Validate existing release and Store CLI
    needs: resolve-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve-release.outputs.artifact }}
          run-id: ${{ needs.resolve-release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: store-upload
      - name: Verify selected version and both architectures
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/resolve-store-upload.py --tag $env:RELEASE_TAG --verify-directory store-upload
      - uses: microsoft/microsoft-store-apppublisher@v1
        with:
          version: v0.4.3
      - name: Validate the actual publishing command without upload
        shell: pwsh
        run: ./scripts/publish-msstore.ps1 -InputDirectory store-upload -ValidateOnly

  submit-release:
    name: Submit existing GA release to Microsoft Store
    if: inputs.mode == 'submit'
    needs: [resolve-release, validate-release]
    runs-on: windows-latest
    environment: microsoft-store
    concurrency:
      group: microsoft-store-submission
      cancel-in-progress: false
    env:
      MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve-release.outputs.artifact }}
          run-id: ${{ needs.resolve-release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: store-upload
      - uses: microsoft/microsoft-store-apppublisher@v1
        with:
          version: v0.4.3
      - name: Authenticate with Partner Center
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store authentication failed.' }
      - name: Submit the existing verified upload
        shell: pwsh
        run: ./scripts/publish-msstore.ps1 -InputDirectory store-upload
