name: CI

on:
  pull_request:
    # main receives already validated stable releases via promotion PRs.
    branches-ignore: [main]
    paths-ignore:
      - "**/*.md"
      - "README*"
      - "docs/**"
      - ".vscode/**"
      - "AGENTS.md"
      - "LICENSE"
      - ".github/dependabot.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ensure Cargo uses the installed CI toolchain instead of the local development pin.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            release:
              - 'scripts/open-release-promotion.py'
              - 'scripts/tests/test_release_promotion.py'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-candidate.yml'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
              - 'crates/**'
              - 'src-tauri/**'
            ui:
              - 'ui/**'
              - 'ui/pnpm-lock.yaml'

  release-promotion-tests:
    name: Release promotion tests
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -p test_release_promotion.py

  rust:
    name: Rust (${{ matrix.os }})
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}
      - run: cargo check --workspace
      - run: cargo check -p sonos-volume-bridge --features ui-demo
      - run: cargo check -p sonos-volume-bridge --features ui-windows
      - run: cargo check -p sonos-volume-bridge --features ui-macos
      - run: cargo check -p sonos-volume-bridge --features ui-ubuntu

  rust-quality:
    name: Rust quality
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - name: Cache Linux desktop package archives
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-linux-desktop-v1
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}
      - run: pnpm run ci:rustfmt
      - run: pnpm run ci:clippy
      - run: pnpm run ci:test
      - run: cargo clippy -p sonos-volume-bridge --all-targets --features ui-demo -- -D warnings
      - run: cargo test -p sonos-volume-bridge --features ui-demo

  frontend:
    name: Frontend
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm run ci:frontend

  macos-packaging:
    name: macOS packaging configuration
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify-macos-packaging-config.sh
