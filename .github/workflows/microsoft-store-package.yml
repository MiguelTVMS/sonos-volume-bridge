name: Microsoft Store Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-store-package-${{ github.ref }}
  cancel-in-progress: false

# Ensure Cargo uses the installed CI toolchain instead of the local development pin.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  msix:
    name: Build Microsoft Store MSIX
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-Windows-${{ matrix.arch }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: cargo install tauri-cli --version '^2' --locked
      - run: cargo tauri build --no-bundle
      - name: Build and validate the MSIX package
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: microsoft-store-msix-${{ matrix.arch }}
          path: target/release/bundle/msix/*.msix
          if-no-files-found: error

  upload:
    name: Build combined Store upload
    needs: msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: microsoft-store-msix-*
          merge-multiple: true
          path: microsoft-store-msix
      - shell: pwsh
        run: ./scripts/build-msix-upload.ps1 -PackageDirectory microsoft-store-msix -OutputPath store-upload/SonosVolumeBridge.msixupload
      - uses: actions/upload-artifact@v7
        with:
          name: microsoft-store-upload
          path: store-upload/*.msixupload
          if-no-files-found: error
