name: Dependency Audit

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.repository }}
  cancel-in-progress: true

# Ensure Cargo uses the installed CI toolchain instead of the local development pin.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  audit:
    name: Cargo dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}
      - run: cargo install cargo-audit --locked
      - run: cargo audit
