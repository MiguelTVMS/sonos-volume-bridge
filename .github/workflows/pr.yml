name: External PR Validation

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "README*"
      - "docs/**"
      - ".vscode/**"
      - "AGENTS.md"
      - "LICENSE"
      - ".github/dependabot.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.md"
      - "Cargo.lock"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: external-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request' && github.event.pull_request != null
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'crates/**'
              - 'src-tauri/**'
            ui:
              - 'ui/**'
              - 'ui/pnpm-lock.yaml'

  rust-lint:
    name: External PR • Rust lint
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Linux desktop package archives
        uses: actions/cache@v6.1.0
        with:
          path: /var/cache/apt/archives
          key: external-pr-${{ runner.os }}-apt-desktop-v1
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: external-pr-rust-lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Run rustfmt
        run: |
          mkdir -p .ci-artifacts
          set -o pipefail
          pnpm run ci:rustfmt 2>&1 | tee .ci-artifacts/rustfmt.log
      - name: Run clippy
        run: |
          mkdir -p .ci-artifacts
          set -o pipefail
          pnpm run ci:clippy 2>&1 | tee .ci-artifacts/clippy.log
      - name: Upload rust lint logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: external-pr-rust-lint-logs-${{ github.run_id }}
          path: .ci-artifacts

  rust-tests:
    name: External PR • Rust tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Linux desktop package archives
        uses: actions/cache@v6.1.0
        with:
          path: /var/cache/apt/archives
          key: external-pr-${{ runner.os }}-apt-desktop-v1
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: external-pr-rust-tests-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Run cargo test
        id: run_tests
        run: |
          mkdir -p .ci-artifacts
          set +e
          pnpm run ci:test 2>&1 | tee .ci-artifacts/cargo-test.log
          test_exit=${PIPESTATUS[0]}
          echo "result=$test_exit" >> "$GITHUB_OUTPUT"
          exit $test_exit
      - name: Generate test result summary
        if: always()
        run: |
          mkdir -p .ci-artifacts
          summary_file=.ci-artifacts/cargo-test-summary.md

          summary_lines=$(grep '^test result:' .ci-artifacts/cargo-test.log || true)

          if [[ -z "$summary_lines" ]]; then
            overall='No test-summary lines were captured. This usually indicates test command compilation failed.'
            total_packages=0
            ok_packages=0
            failed_packages=0
            passed_tests=0
            failed_tests=0
            ignored_tests=0
            measured_tests=0
            filtered_tests=0
          else
            total_packages=$(echo "$summary_lines" | wc -l)
            ok_packages=$(echo "$summary_lines" | grep -c ' ok\.' || true)
            failed_packages=$(echo "$summary_lines" | grep -c ' FAILED\.' || true)
            passed_tests=$(echo "$summary_lines" | awk 'match($0, /([0-9]+) passed;/, a) {sum += a[1]} END {print sum + 0}')
            failed_tests=$(echo "$summary_lines" | awk 'match($0, /([0-9]+) failed;/, a) {sum += a[1]} END {print sum + 0}')
            ignored_tests=$(echo "$summary_lines" | awk 'match($0, /([0-9]+) ignored;/, a) {sum += a[1]} END {print sum + 0}')
            measured_tests=$(echo "$summary_lines" | awk 'match($0, /([0-9]+) measured;/, a) {sum += a[1]} END {print sum + 0}')
            filtered_tests=$(echo "$summary_lines" | awk 'match($0, /([0-9]+) filtered out;/, a) {sum += a[1]} END {print sum + 0}')
            if [[ "${{ steps.run_tests.outputs.result }}" == "0" ]]; then
              overall='All test suites completed successfully.'
            else
              overall='One or more test suites failed.'
            fi
          fi

          cat > "$summary_file" <<EOF
          ### Rust test summary

          - Exit code: ${{ steps.run_tests.outputs.result }}
          - Overall: $overall
          - Test suites: ${total_packages}
          - Passed suites: ${ok_packages}
          - Failed suites: ${failed_packages}
          - Total passed: ${passed_tests}
          - Total failed: ${failed_tests}
          - Total ignored: ${ignored_tests}
          - Total measured: ${measured_tests}
          - Total filtered: ${filtered_tests}

          #### Raw summary lines
          EOF
          if [[ -n "$summary_lines" ]]; then
            while IFS= read -r line; do
              printf '- `%s`\n' "$line" >> "$summary_file"
            done <<< "$summary_lines"
          else
            echo '- (none)' >> "$summary_file"
          fi

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          echo "summary_file=$summary_file" >> "$GITHUB_OUTPUT"
      - name: Upload rust test artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: external-pr-rust-test-artifacts-${{ github.run_id }}
          path: .ci-artifacts
      - name: Post test summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- ci-rust-test-summary -->';
            let body = `${marker}\n`;
            const summaryPath = '.ci-artifacts/cargo-test-summary.md';
            if (fs.existsSync(summaryPath)) {
              body += fs.readFileSync(summaryPath, 'utf8');
            } else {
              body += 'Rust test summary file not found.';
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
              },
            );
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  frontend-lint:
    name: External PR • Frontend lint
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Run frontend format
        run: |
          mkdir -p .ci-artifacts
          set -o pipefail
          pnpm run ci:ui-format 2>&1 | tee .ci-artifacts/frontend-format.log
      - name: Run frontend lint
        run: |
          mkdir -p .ci-artifacts
          set -o pipefail
          pnpm run ci:ui-lint 2>&1 | tee .ci-artifacts/frontend-lint.log
      - name: Upload frontend lint logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: external-pr-frontend-lint-logs-${{ github.run_id }}
          path: .ci-artifacts

  frontend-build:
    name: External PR • Frontend build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Run frontend build
        run: |
          mkdir -p .ci-artifacts
          set -o pipefail
          pnpm run ci:ui-build 2>&1 | tee .ci-artifacts/frontend-build.log
      - name: Upload frontend build logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: external-pr-frontend-build-logs-${{ github.run_id }}
          path: .ci-artifacts
