[package]
name = "sonos-volume-bridge-platform-camera"
description = "Passive aggregate camera activity observation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
camera-automation-macos = []
camera-automation-windows = []

[dependencies]
sonos-volume-bridge-domain = { path = "../domain" }
sonos-volume-bridge-integration = { path = "../integration" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }
windows-core.workspace = true

[lints]
workspace = true
